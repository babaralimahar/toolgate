[project]
name = "toolgate"
version = "0.1.0"
description = "Governed MCP gateway over P1-P4: deny-by-default policy, bound approvals, hash-chained audit, eval regression gate."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # <2.1: opentelemetry-instrumentation-sqlalchemy silently skips 2.1 (no DB spans)
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "structlog>=24.4",
  "tenacity>=9.0",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "prometheus-client>=0.21",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "python-multipart>=0.0.20",
  "pyjwt>=2.9",
  "rapidfuzz>=3.10",
  "jinja2>=3.1",
  "mcp>=1.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/toolgate"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["UP046"]  # pydantic generics keep the Generic[T] form

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "E501", "ASYNC240"]
"migrations/versions/0002_toolgate.py" = ["E501"]  # SQL DDL
"src/toolgate/**" = ["E501"]  # SQL, HTML, report and tool-description strings
"src/toolgate/regress.py" = ["E501", "S603"]  # runs the fixed eval commands from regression.yaml

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*", "jwt.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: needs a real Postgres (TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["src/app", "src/toolgate"]
branch = true
